<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>成长日记 · 管理后台</title>
<style>
  body{ font-family:"PingFang SC","Hiragino Sans GB",sans-serif; max-width:700px; margin:20px auto; padding:0 16px; color:#222; }
  h1{ font-size:24px; margin-bottom:14px; }
  label{ display:block; font-weight:bold; margin:14px 0 6px; }
  input[type=text], textarea{ width:100%; padding:10px; font-size:16px; border:1px solid #ccc; border-radius:6px; box-sizing:border-box; font-family:inherit; }
  textarea{ height:120px; resize:vertical; }
  .hint{ font-size:13px; color:#888; margin-top:4px; }
  button{ background:#000; color:#fff; border:none; padding:14px 22px; font-size:17px; border-radius:8px; margin-top:18px; cursor:pointer; }
  #status{ margin-top:14px; font-size:15px; padding:10px; border-radius:6px; }
  .ok{ background:#e6f4ea; color:#137333; }
  .bad{ background:#fce8e6; color:#c5221f; }
  .token{ margin-top:20px; padding-top:16px; border-top:1px solid #eee; }
  .datedList{ font-size:13px; color:#555; margin-top:6px; }
  .datedList a{ color:#1967d2; cursor:pointer; margin-right:8px; }
</style>
</head>
<body>
  <h1>雪碧成长日记 · 管理后台</h1>
  <label>标题（全局，所有日期共用）</label>
  <input type="text" id="title" value="雪碧成长日记">
  <label>日期（YYYY-MM-DD，留空为今天）</label>
  <input type="text" id="date" placeholder="2026-11-08">
  <div class="datedList" id="datedList"></div>
  <label>今日打卡（每行一项）</label>
  <textarea id="checklist"></textarea>
  <label>今日作业（每行一项）</label>
  <textarea id="homework"></textarea>
  <label>成长日记</label>
  <textarea id="diary" style="height:80px;"></textarea>

  <div class="token">
    <label>GitHub Token（仅本浏览器保存，用于保存数据）</label>
    <input type="text" id="token" placeholder="ghp_...">
    <div class="hint">需要 repo 权限的 personal access token。保存在本浏览器 localStorage，不会上传到任何第三方。目标仓库：jo20099/kindle-diary，文件：data.json。数据按日期归档，可回看历史。</div>
  </div>

  <button onclick="save()">保存并发布</button>
  <div id="status"></div>

<script>
  var REPO='jo20099/kindle-diary';
  var FILE='data.json';
  function setStatus(msg, cls){ var s=document.getElementById('status'); s.className=cls||''; s.innerHTML=msg; }
  function loadToken(){ try{ return localStorage.getItem('sb_admin_token')||''; }catch(e){ return ''; } }
  function saveToken(t){ try{ localStorage.setItem('sb_admin_token', t); }catch(e){} }
  function todayStr(){ var d=new Date(); var p=function(n){return ('0'+n).slice(-2);}; return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
  function b64EncodeUnicode(str){ return btoa(unescape(encodeURIComponent(str))); }
  function b64DecodeUnicode(str){ return decodeURIComponent(escape(atob(str.replace(/\s/g,'')))); }
  function splitLines(s){ return s.split('\n').map(function(x){return x.trim();}).filter(function(x){return x;}); }

  var CURRENT=null; // 已加载的整份数据

  function renderDatedList(){
    var box=document.getElementById('datedList');
    if(!CURRENT || !CURRENT.days){ box.innerHTML=''; return; }
    var keys=Object.keys(CURRENT.days).sort().reverse();
    if(keys.length===0){ box.innerHTML=''; return; }
    box.innerHTML='已有记录：' + keys.map(function(k){ return '<a onclick="loadDay(\''+k+'\')">'+k+'</a>'; }).join('');
  }

  function loadDay(date){
    document.getElementById('date').value=date;
    if(CURRENT && CURRENT.days && CURRENT.days[date]){
      var e=CURRENT.days[date];
      document.getElementById('checklist').value=(e.checklist||[]).join('\n');
      document.getElementById('homework').value=(e.homework||[]).join('\n');
      document.getElementById('diary').value=e.diary||'';
    } else {
      document.getElementById('checklist').value='';
      document.getElementById('homework').value='';
      document.getElementById('diary').value='';
    }
  }

  function fetchData(cb){
    var xhr=new XMLHttpRequest();
    xhr.open('GET','https://api.github.com/repos/'+REPO+'/contents/'+FILE,true);
    xhr.setRequestHeader('Authorization','token '+loadToken());
    xhr.setRequestHeader('Accept','application/vnd.github.v3+json');
    xhr.onreadystatechange=function(){
      if(xhr.readyState!==4) return;
      if(xhr.status>=200 && xhr.status<300){
        try{
          var obj=JSON.parse(xhr.responseText);
          var content=b64DecodeUnicode(obj.content);
          var data=JSON.parse(content);
          cb(data, obj.sha, null);
        }catch(e){ cb(null,null,'解析现有数据失败'); }
      } else if(xhr.status===404){
        cb({}, null, null); // 文件不存在，当作空
      } else {
        cb(null,null,'读取仓库失败（'+xhr.status+'）');
      }
    };
    xhr.send();
  }

  // 初始化：载入标题、最近一天、历史列表
  (function(){
    document.getElementById('token').value=loadToken();
    var xhr=new XMLHttpRequest();
    xhr.open('GET','data.json?_='+Date.now(),true);
    xhr.onreadystatechange=function(){
      if(xhr.readyState===4 && xhr.status>=200 && xhr.status<300){
        try{
          var d=JSON.parse(xhr.responseText);
          CURRENT=d;
          if(d.title) document.getElementById('title').value=d.title;
          var date=null;
          if(d.days){ var keys=Object.keys(d.days).sort(); date=keys[keys.length-1]||todayStr(); }
          else { date=d.date||todayStr(); }
          document.getElementById('date').value=date;
          loadDay(date);
          renderDatedList();
        }catch(e){}
      }
    };
    xhr.send();
  })();

  // 切换日期时，同步表单内容
  document.getElementById('date').addEventListener('change', function(){
    loadDay(this.value.trim());
  });

  function save(){
    var token=document.getElementById('token').value.trim();
    if(!token){ setStatus('请先填写 GitHub Token','bad'); return; }
    saveToken(token);
    var date=document.getElementById('date').value.trim() || todayStr();
    var title=document.getElementById('title').value;
    var entry={
      checklist: splitLines(document.getElementById('checklist').value),
      homework: splitLines(document.getElementById('homework').value),
      diary: document.getElementById('diary').value
    };

    fetchData(function(data, sha, err){
      if(err){ setStatus(err,'bad'); return; }
      if(!data || typeof data!=='object') data={};
      if(!data.title) data.title=title; else data.title=title;
      if(!data.days) data.days={};
      data.days[date]=entry;

      var content=JSON.stringify(data,null,2);
      var body={ message:'update '+date+' via admin', content: b64EncodeUnicode(content) };
      if(sha) body.sha=sha;

      var putXhr=new XMLHttpRequest();
      putXhr.open('PUT','https://api.github.com/repos/'+REPO+'/contents/'+FILE,true);
      putXhr.setRequestHeader('Authorization','token '+token);
      putXhr.setRequestHeader('Content-Type','application/json');
      putXhr.setRequestHeader('Accept','application/vnd.github.v3+json');
      putXhr.onreadystatechange=function(){
        if(putXhr.readyState!==4) return;
        if(putXhr.status>=200 && putXhr.status<300){
          CURRENT=data; renderDatedList();
          setStatus('已保存 '+date+'！约 1 分钟后在 Kindle 上点「刷新」，翻到该日期即可看到。','ok');
        }else{
          var m='保存失败（'+putXhr.status+'）';
          try{ m+='：'+JSON.parse(putXhr.responseText).message; }catch(e){}
          setStatus(m,'bad');
        }
      };
      putXhr.send(JSON.stringify(body));
    });
  }
</script>
</body>
</html>
