name: Refresh weather screensaver
on:
  schedule:
    - cron: '0 1,4,7,10,13,16,19,22 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-wqy-zenhei
          python -m pip install --quiet Pillow
      - name: Generate weather PNG
        run: python gen_weather.py --out weather.png
      - name: Commit if changed
        run: |
          git config user.name  "weather-bot"
          git config user.email "weather-bot@users.noreply.github.com"
          git add weather.png
          if git diff --cached --quiet; then
            echo "weather unchanged, skip commit"
          else
            git commit -m "chore: refresh weather screensaver [skip ci]"
            git push
          fi
