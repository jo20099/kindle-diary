<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>瓜瓜成长日记</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { background:#fff; color:#000; }
body { font-family:sans-serif; -webkit-text-size-adjust:none; line-height:1.15; padding-bottom:390px; }
#bar { font-size:26px; padding:8px 10px; border-bottom:2px solid #000; display:flex; flex-wrap:wrap; align-items:center; gap:4px; }
#bar b { font-size:30px; margin-right:auto; }
.btn { display:inline-block; border:2px solid #000; padding:1px 10px; margin-left:5px; font-size:24px; color:#000; text-decoration:none; }
table { width:100%; border-collapse:collapse; table-layout:fixed; }
.col { vertical-align:top; padding:5px 12px 2px; }
.sec { font-size:26px; font-weight:bold; border-bottom:1px solid #000; padding-bottom:2px; margin-bottom:3px; }
/* 作业/打卡条目：长文本自动换行（支持单条最多 ~150 字） */
.item { font-size:28px; line-height:40px; word-break:break-all; }
.item input { width:24px; height:24px; margin-right:7px; vertical-align:middle; }
.empty { font-size:24px; color:#555; line-height:38px; }

/* 底部固定块（钉屏幕最底）：成长日记 → 雪碧独立一行 → 天气 */
#bottom { position:fixed; left:0; bottom:0; width:100%; background:#fff; border-top:2px solid #000; }
#diaryRow { padding:6px 14px; border-bottom:2px solid #000; }
#diaryRow p { font-size:26px; line-height:38px; word-break:break-all; }
/* 雪碧单独一行：左=猫咪图像，右=招呼文字，同一行内左右排布 */
#mascotRow td { vertical-align:middle; border-bottom:2px solid #000; }
#mascotRow .cat { width:200px; padding:4px 0 4px 10px; }
#mascotRow .cat img { display:block; }
#mascotRow .say { padding:6px 14px; text-align:left; }
#mascotRow .bubble { font-size:28px; line-height:38px; font-weight:bold; color:#000; word-break:break-all; }
#mascotRow .greet { font-size:22px; line-height:30px; color:#333; margin-top:6px; word-break:break-all; }
#wt th { font-size:22px; font-weight:normal; color:#333; background:#eee; padding:3px 0; }
#wt td { text-align:center; padding:4px 2px; }
.wd { font-size:24px; font-weight:bold; }
.wx { font-size:24px; }
.wt3 { font-size:22px; color:#222; }
</style>
</head>
<body>

<div id="bar">&nbsp;</div>

<table id="main">
  <tr>
    <td class="col" style="width:55%">
      <div class="sec">今日作业</div>
      <div id="hw"></div>
    </td>
    <td class="col" style="width:45%">
      <div class="sec">今日打卡</div>
      <div id="ck"></div>
    </td>
  </tr>
</table>

<div id="bottom">
  <div id="diaryRow">
    <div class="sec">成长日记</div>
    <p id="diary">&nbsp;</p>
  </div>
  <table id="mascotRow">
    <tr>
      <td class="cat"><img src="cat.png" width="190" height="190" alt="cat"></td>
      <td class="say">
        <div class="bubble" id="greet1">&nbsp;</div>
        <div class="greet" id="greet2">&nbsp;</div>
      </td>
    </tr>
  </table>
  <table id="wt">
    <tr><th id="wtCity" colspan="3">天气 · 最近三天</th></tr>
    <tr>
      <td id="wt0"><span class="empty">…</span></td>
      <td id="wt1"><span class="empty">…</span></td>
      <td id="wt2"><span class="empty">…</span></td>
    </tr>
  </table>
</div>

<script>
var DATA=null, cur=null, latest=null;
function pad(n){ return (n<10?'0':'')+n; }
function fmtDate(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function weekCN(d){ return '周'+'日一二三四五六'.charAt(d.getDay()); }
/* 英文日期：Monday, November 9, 2026（不依赖 Intl，兼容老浏览器） */
function fmtDateEN(d){
  if(isNaN(d)) return '';
  var wd=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][d.getDay()];
  var mo=['January','February','March','April','May','June','July','August','September','October','November','December'][d.getMonth()];
  return wd+', '+mo+' '+d.getDate()+', '+d.getFullYear();
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function done(d,i){ try{ return localStorage.getItem('ck_'+d+'_'+i)=='1'; }catch(e){ return false; } }
function tog(i){ try{ localStorage.setItem('ck_'+cur+'_'+i, done(cur,i)?'0':'1'); }catch(e){} }
function done2(d,i){ try{ return localStorage.getItem('hw_'+d+'_'+i)=='1'; }catch(e){ return false; } }
function tog2(i){ try{ localStorage.setItem('hw_'+cur+'_'+i, done2(cur,i)?'0':'1'); }catch(e){} }

/* 随机打招呼 + 激励（每次刷新换一句） */
var GREET=['早安，瓜瓜！雪碧来啦～','嗨，瓜瓜～我是雪碧！','瓜瓜你好呀，雪碧报到！','瓜瓜今天也要元气满满哦！','喵～瓜瓜，雪碧来陪你啦！'];
var PUSH =['完成打卡，瓜瓜最棒啦！','今天的作业也难不倒瓜瓜，冲鸭！','读完一本书，瓜瓜就离聪明更近一步！','坚持一下，胜利就在眼前，瓜瓜加油！','认真的样子最可爱啦，瓜瓜！','每完成一项，就给自己点个赞，瓜瓜！'];
function rnd(a){ return a[Math.floor(Math.random()*a.length)]; }
function setGreet(){
  document.getElementById('greet1').innerHTML=rnd(GREET);
  document.getElementById('greet2').innerHTML=rnd(PUSH);
}

function load(){
  var x=new XMLHttpRequest();
  x.open('GET','data.json?t='+(new Date()).getTime(),true);
  x.onreadystatechange=function(){
    if(x.readyState==4 && x.status==200){
      try{ DATA=JSON.parse(x.responseText); }catch(e){ DATA=null; }
      if(!DATA) return;
      var ks=[], days=DATA.days||{}, k;
      for(k in days){ if(days.hasOwnProperty(k)) ks.push(k); }
      ks.sort();
      latest=ks.length?ks[ks.length-1]:fmtDate(new Date());
      if(!cur) cur=latest;
      render(); setGreet(); weather();
    }
  };
  x.send(null);
}

function render(){
  var days=(DATA&&DATA.days)||{}, dd=days[cur]||{};
  var dt=new Date(cur.replace(/-/g,'/'));
  document.getElementById('bar').innerHTML=
    '<b>'+fmtDateEN(dt)+'</b>'
    +'<a class="btn" href="javascript:void(0)" onclick="page(-1)" title="前一天" aria-label="前一天">◀</a>'
    +'<a class="btn" href="javascript:void(0)" onclick="page(1)" title="后一天" aria-label="后一天">▶</a>'
    +'<a class="btn" href="javascript:void(0)" onclick="goLatest()" title="今天" aria-label="今天"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="16" y1="2" x2="16" y2="6"/></svg></a>'
    +'<a class="btn" href="javascript:void(0)" onclick="load()" title="刷新" aria-label="刷新">↻</a>';

  var ck=dd.checklist||[], s='', i;
  if(!ck.length) s='<div class="empty">这一天还没有录入～</div>';
  for(i=0;i<ck.length;i++){
    s+='<div class="item"><input type="checkbox"'+(done(cur,i)?' checked':'')+' onclick="tog('+i+')"> '+esc(ck[i])+'</div>';
  }
  document.getElementById('ck').innerHTML=s;

  var hw=dd.homework||[], t='', j;
  if(!hw.length) t='<div class="empty">没有作业，痛快玩！</div>';
  for(j=0;j<hw.length;j++){
    t+='<div class="item"><input type="checkbox"'+(done2(cur,j)?' checked':'')+' onclick="tog2('+j+')"> '+esc(hw[j])+'</div>';
  }
  document.getElementById('hw').innerHTML=t;

  document.getElementById('diary').innerHTML=dd.diary?esc(dd.diary):'<span class="empty">这一天还没有日记～</span>';
}
function page(n){ var dt=new Date(cur.replace(/-/g,'/')); dt.setDate(dt.getDate()+n); cur=fmtDate(dt); render(); }
function goLatest(){ cur=latest; render(); }

var WMO={0:'晴',1:'晴',2:'多云',3:'阴',45:'雾',48:'雾',51:'毛毛雨',53:'毛毛雨',55:'毛毛雨',56:'冻毛毛雨',57:'冻毛毛雨',61:'小雨',63:'中雨',65:'大雨',66:'冻雨',67:'冻雨',71:'小雪',73:'中雪',75:'大雪',77:'米雪',80:'阵雨',81:'阵雨',82:'强阵雨',85:'阵雪',86:'阵雪',95:'雷阵雨',96:'雷阵雨',99:'雷冰雹'};
function weather(){
  if(!DATA||!DATA.weather) return;
  var w=DATA.weather;
  document.getElementById('wtCity').innerHTML=esc(w.city||'')+' · 最近三天';
  var url='https://api.open-meteo.com/v1/forecast?latitude='+w.lat+'&longitude='+w.lon+'&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=3';
  var x=new XMLHttpRequest();
  x.open('GET',url,true);
  x.onreadystatechange=function(){
    if(x.readyState==4&&x.status==200){
      var j; try{ j=JSON.parse(x.responseText).daily; }catch(e){ return; }
      var names=['今天','明天','后天'];
      for(var i=0;i<3;i++){
        var wx=WMO[j.weather_code[i]]||'—';
        var hi=Math.round(j.temperature_2m_max[i]), lo=Math.round(j.temperature_2m_min[i]);
        document.getElementById('wt'+i).innerHTML='<div class="wd">'+names[i]+'</div><div class="wx">'+wx+'</div><div class="wt3">'+hi+'° / '+lo+'°</div>';
      }
    }
  };
  x.send(null);
}
load();
setInterval(load,60000);
</script>
</body>
</html>
