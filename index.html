<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>雪碧成长日记</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#fff; color:#000; font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif; -webkit-text-size-adjust:100%; }
  body { padding:12px 14px; max-width:800px; margin:0 auto; }
  .topbar { background:#000; color:#fff; padding:12px 16px; font-size:32px; font-weight:bold; border-radius:6px; }
  .subbar { display:flex; align-items:center; justify-content:space-between; margin:10px 2px 6px; gap:8px; flex-wrap:wrap; }
  .nav button { background:#000; color:#fff; border:none; font-size:18px; padding:8px 12px; border-radius:8px; }
  .nav .today-btn { background:#555; }
  .date { font-size:22px; font-weight:bold; }
  .date small { font-size:15px; color:#666; font-weight:normal; }
  /* 天气条 */
  .weather { display:flex; border:2px solid #000; border-radius:8px; overflow:hidden; margin:6px 0 12px; }
  .wday { flex:1; text-align:center; padding:8px 4px; border-right:2px solid #999; }
  .wday:last-child { border-right:none; }
  .wlabel { font-size:18px; font-weight:bold; }
  .wico { font-size:20px; margin:2px 0; }
  .wtemp { font-size:18px; }
  .wnote { font-size:16px; color:#999; padding:6px 2px; }
  /* 板块 */
  .sec { margin-bottom:12px; }
  .sec-title { font-size:26px; font-weight:bold; border-bottom:2px solid #999; padding-bottom:4px; margin-bottom:6px; }
  .item { display:flex; align-items:flex-start; font-size:26px; line-height:1.3; padding:6px 2px; border-bottom:1px solid #e0e0e0; }
  .box { width:28px; height:28px; border:2px solid #000; border-radius:4px; margin-right:14px; flex:0 0 auto; margin-top:1px; text-align:center; font-size:22px; line-height:26px; }
  .done .box { background:#000; color:#fff; }
  .done .txt { text-decoration:line-through; color:#999; }
  .diary { font-size:24px; line-height:1.5; padding:4px 2px; }
  .empty { font-size:22px; color:#999; padding:8px 2px; }
  .sec3 { display:flex; gap:14px; }
  .sec3 .col { flex:1; min-width:0; }
  .refresh { position:fixed; right:14px; bottom:14px; background:#000; color:#fff; border:none; font-size:18px; padding:12px 18px; border-radius:28px; }
  .status { font-size:13px; color:#999; text-align:center; margin-top:6px; }
  #err { color:#c00; font-size:15px; padding:8px; display:none; }
</style>
</head>
<body>
  <div class="topbar" id="title">雪碧成长日记</div>

  <div class="subbar">
    <span class="date" id="date"></span>
    <span class="nav">
      <button onclick="goDay(-1)">←前</button>
      <button class="today-btn" onclick="goToday()">今天</button>
      <button onclick="goDay(1)">后→</button>
    </span>
  </div>

  <div class="weather" id="weather"><div class="wnote" id="wnote">天气加载中…</div></div>

  <div class="sec3">
    <div class="col">
      <div class="sec">
        <div class="sec-title">打卡</div>
        <div id="checklist"></div>
      </div>
      <div class="sec">
        <div class="sec-title">作业</div>
        <div id="homework"></div>
      </div>
    </div>
    <div class="col">
      <div class="sec">
        <div class="sec-title">日记</div>
        <div class="diary" id="diary"></div>
      </div>
    </div>
  </div>

  <button class="refresh" onclick="loadData()">刷新</button>
  <div class="status" id="status"></div>
  <div id="err"></div>

<script>
  var DATA=null;
  var currentDate=null;
  var weatherLoaded=false;

  function setStatus(t){ var s=document.getElementById('status'); if(s) s.innerHTML=t; }
  function showErr(t){ var e=document.getElementById('err'); if(e){ e.style.display='block'; e.innerHTML=t; } }
  function clearErr(){ var e=document.getElementById('err'); if(e) e.style.display='none'; }
  function pad(n){ return ('0'+n).slice(-2); }
  function todayStr(){ var d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function shiftDate(str, delta){
    var p=str.split('-'); var d=new Date(parseInt(p[0],10), parseInt(p[1],10)-1, parseInt(p[2],10));
    d.setDate(d.getDate()+delta);
    return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  }
  function storeKey(date, idx){ return 'sb_'+date+'_'+idx; }

  function pickDefault(){
    if(DATA && DATA.days){ var keys=Object.keys(DATA.days).sort(); return keys[keys.length-1] || todayStr(); }
    return (DATA && DATA.date) ? DATA.date : todayStr();
  }

  function renderList(elId, arr, date){
    var el=document.getElementById(elId); if(!el) return; el.innerHTML='';
    if(!arr || arr.length===0){ el.innerHTML='<div class="empty">（无）</div>'; return; }
    for(var i=0;i<arr.length;i++){
      var key=storeKey(date,i);
      var checked=false;
      try{ checked = localStorage.getItem(key)==='1'; }catch(e){}
      var div=document.createElement('div');
      div.className='item'+(checked?' done':'');
      var box=document.createElement('div'); box.className='box'; box.innerHTML=checked?'✓':'';
      var txt=document.createElement('div'); txt.className='txt'; txt.innerHTML=arr[i];
      (function(idx,div,box){
        div.onclick=function(){
          var k=storeKey(date,idx);
          var now = (localStorage.getItem(k)==='1');
          try{ localStorage.setItem(k, now?'0':'1'); }catch(e){}
          var nd = !now;
          div.className='item'+(nd?' done':'');
          box.innerHTML=nd?'✓':'';
        };
      })(i,div,box);
      div.appendChild(box); div.appendChild(txt); el.appendChild(div);
    }
  }

  function renderDay(){
    if(!DATA || !currentDate) return;
    if(DATA.title) document.getElementById('title').innerHTML=DATA.title;
    var isToday = (currentDate===todayStr());
    document.getElementById('date').innerHTML = currentDate + (isToday?' <small>（今天）</small>':'');

    var entry=null;
    if(DATA.days && DATA.days[currentDate]){
      entry = DATA.days[currentDate];
    } else if(!DATA.days){
      entry = { checklist:DATA.checklist||[], homework:DATA.homework||[], diary:DATA.diary||'' };
    }

    if(!entry){
      document.getElementById('checklist').innerHTML='<div class="empty">这天没录入</div>';
      document.getElementById('homework').innerHTML='<div class="empty">（无）</div>';
      document.getElementById('diary').innerHTML='<div class="empty">（无）</div>';
      return;
    }
    renderList('checklist', entry.checklist||[], currentDate);
    renderList('homework', entry.homework||[], currentDate);
    document.getElementById('diary').innerHTML=entry.diary||'<div class="empty">（无）</div>';
  }

  function goDay(delta){ if(!currentDate) return; currentDate=shiftDate(currentDate,delta); renderDay(); }
  function goToday(){ currentDate=todayStr(); renderDay(); }

  // 天气：Open-Meteo 免费接口，无需密钥，支持 CORS
  var WMO = {
    0:'晴',1:'晴间多云',2:'多云',3:'阴',
    45:'雾',48:'雾凇',
    51:'毛毛雨',53:'毛毛雨',55:'毛毛雨',
    56:'冻雨',57:'冻雨',
    61:'小雨',63:'中雨',65:'大雨',
    66:'冻雨',67:'冻雨',
    71:'小雪',73:'中雪',75:'大雪',77:'雪粒',
    80:'阵雨',81:'阵雨',82:'强阵雨',
    85:'阵雪',86:'阵雪',
    95:'雷阵雨',96:'雷阵雨冰雹',99:'雷阵雨冰雹'
  };
  var WDAY = ['今天','明天','后天'];
  function renderWeather(){
    var w=DATA && DATA.weather;
    var note=document.getElementById('wnote');
    var box=document.getElementById('weather');
    if(!w || w.lat==null || w.lon==null){
      box.innerHTML='<div class="wnote">未配置地点（后台设置经纬度）</div>';
      return;
    }
    var url='https://api.open-meteo.com/v1/forecast?latitude='+w.lat+'&longitude='+w.lon+
           '&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=3';
    var xhr=new XMLHttpRequest();
    xhr.open('GET',url,true);
    xhr.onreadystatechange=function(){
      if(xhr.readyState!==4) return;
      if(xhr.status>=200 && xhr.status<300){
        try{
          var d=JSON.parse(xhr.responseText).daily;
          var html='';
          for(var i=0;i<3;i++){
            var code=d.weather_code[i];
            var txt=WMO[code]!=null?WMO[code]:('代码'+code);
            html+='<div class="wday"><div class="wlabel">'+(WDAY[i]||d.time[i])+'</div>'+
                  '<div class="wico">'+txt+'</div>'+
                  '<div class="wtemp">'+Math.round(d.temperature_2m_max[i])+'°/'+Math.round(d.temperature_2m_min[i])+'°</div></div>';
          }
          if(w.city) html='<div style="flex:0 0 100%;font-size:18px;font-weight:bold;padding:6px 4px;border-bottom:2px solid #999;">'+w.city+' 天气</div>'+html;
          box.innerHTML=html;
        }catch(e){ box.innerHTML='<div class="wnote">天气解析失败</div>'; }
      } else {
        box.innerHTML='<div class="wnote">天气获取失败（'+xhr.status+'）</div>';
      }
    };
    xhr.send();
  }

  function loadData(){
    setStatus('正在加载…');
    var xhr=new XMLHttpRequest();
    xhr.open('GET','data.json?_='+Date.now(),true);
    xhr.setRequestHeader('Cache-Control','no-cache');
    xhr.onreadystatechange=function(){
      if(xhr.readyState===4){
        if(xhr.status>=200 && xhr.status<300){
          try{
            DATA=JSON.parse(xhr.responseText);
            clearErr();
            if(!currentDate) currentDate=pickDefault();
            renderDay();
            if(!weatherLoaded){ renderWeather(); weatherLoaded=true; }
            setStatus('已更新 '+new Date().toLocaleTimeString());
          }catch(e){ showErr('数据解析失败'); setStatus(''); }
        }else{
          showErr('加载失败（'+xhr.status+'），请稍后点刷新'); setStatus('');
        }
      }
    };
    xhr.send();
  }
  loadData();
  setInterval(loadData, 60000);
</script>
</body>
</html>
