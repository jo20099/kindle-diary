<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>瓜瓜成长日记</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { background:#fff; color:#000; }
/* 全局字体栈：英文用经典无衬线，中文回退到苹方/雅黑， Kindle 等老浏览器回落到 Arial/系统 */
body { font-family:'Helvetica Neue', Helvetica, Arial, 'Segoe UI', Roboto, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif; -webkit-text-size-adjust:none; line-height:1.3; }
/* 顶栏用 table 排版（KPW2 老内核对 flex 支持不稳）：日期 | 四个操作按钮 | 游戏按钮，强制同一行
   三列宽度按 24/29.6/46.4 分配：操作按钮右缘与主区第一列（55%）内容右缘对齐，
   即与下方“作业要求 ›”链接右缘齐平。758px 实测两者右缘同为 405px */
#bar { font-size:24px; padding:9px 12px; border-bottom:2px solid #000; }
#bar table { width:100%; border-collapse:collapse; table-layout:fixed; }
#bar td { vertical-align:middle; white-space:nowrap; }
#bar td.barDate { width:24%; font-size:22px; font-weight:300; letter-spacing:0.3px; color:#1a1a1a; }
#bar td.barOps { text-align:right; width:29.6%; }
#bar td.barGames { text-align:right; width:46.4%; }
/* 四个按钮统一为等高等宽盒子：无论文字还是 SVG 都垂直水平居中、高度一致 */
.btn { display:inline-block; width:36px; height:36px; line-height:32px; padding:0; border:2px solid #000; font-size:23px; text-align:center; color:#000; text-decoration:none; vertical-align:middle; margin-left:11px; }
.btn svg { display:inline-block; vertical-align:middle; width:20px; height:20px; }
table { width:100%; border-collapse:collapse; table-layout:fixed; }
/* 主内容滚动区：高度由 JS 按视口-顶栏-底栏算成固定像素，避免被 fixed 底栏遮住长作业 */
#scroll { overflow-y:auto; -webkit-overflow-scrolling:touch; padding:0 12px; }
.sec { font-size:25px; font-weight:600; letter-spacing:0.5px; border-bottom:1px solid #000; padding-bottom:3px; margin:6px 0 5px; }
/* 今日打卡区块（在今日作业下方）：与作业区分隔，2px 横线+更大上间距 */
.secGap { border-top:2px solid #000; margin-top:14px; padding-top:8px; }
/* 打卡两列：用 table 排版（老内核不支持 grid/flex），每行 2 项，同排等高、长文本自动折行不串位 */
#ckTable { width:100%; border-collapse:collapse; table-layout:fixed; }
#ckTable td { width:50%; vertical-align:top; padding:0 10px 0 0; }
#ckTable td.last { padding-right:0; }
/* 雪碧提醒徽标（明天有雨带伞 / 次日周五周一穿校服），随标题行右浮动，无提醒时隐藏 */
/* 提醒态（有雨带伞/周五周一校服）：加粗醒目；无提醒时为普通夸夸话术 */
#remind.on { font-weight:700; color:#000; }
/* 作业/打卡条目：长文本自动换行（支持单条最多 ~150 字） */
.item { font-size:28px; line-height:40px; word-break:break-all; cursor:pointer; }
/* 已完成：整行置灰 + 文本删除线 */
.item.done { opacity:.4; }
.item.done .txt { text-decoration:line-through; }
.item input { width:24px; height:24px; margin-right:7px; vertical-align:middle; }
.empty { font-size:24px; color:#555; line-height:38px; }
/* 作业要求入口：今日作业/今日打卡标题行右侧文字链接；点击整页弹窗展示（墨水屏友好，纯边框无阴影） */
.secLink { float:right; font-size:21px; font-weight:normal; color:#111; text-decoration:underline; cursor:pointer; }
#rulesPop { position:fixed; left:0; top:0; width:100%; height:100%; background:#fff; z-index:10003; display:none; overflow-y:auto; }
#rulesPop.on { display:block; }
#rulesPopHead { font-size:26px; font-weight:700; padding:10px 14px; border-bottom:2px solid #000; }
#rulesPopClose { float:right; font-size:20px; font-weight:normal; color:#111; background:#fff; border:2px solid #000; padding:3px 12px; cursor:pointer; }
#rulesPopBody { padding:10px 14px 40px; }
.ruleCard { margin:8px 0; border:1.5px solid #000; }
.ruleTitle { font-size:24px; font-weight:700; background:#111; color:#fff; padding:5px 10px; }
.ruleList { padding:5px 9px; }
.ruleItem { font-size:22px; line-height:33px; word-break:break-all; }

/* 底部固定块：雪碧对你说（标题+内容同一行）→ 雪碧独立一行 → 天气 */
#bottom { position:fixed; left:0; bottom:0; width:100%; background:#fff; border-top:2px solid #000; }
#diaryRow { padding:6px 14px; border-bottom:2px solid #000; font-size:24px; line-height:36px; word-break:break-all; }
#diaryRow .dLabel { font-weight:700; }
/* 雪碧单独一行：左=猫咪图像，右=招呼文字，同一行内左右排布 */
#mascotRow td { vertical-align:middle; border-bottom:2px solid #000; }
#mascotRow .cat { width:162px; padding:4px 0 4px 10px; }
#mascotRow .cat img { display:block; }
#mascotRow .say { padding:6px 14px; text-align:left; }
#mascotRow .bubble { font-size:26px; line-height:35px; font-weight:600; color:#000; word-break:break-all; }
#mascotRow .bubble .src { font-size:19px; font-weight:400; color:#555; }
#mascotRow .greet { font-size:22px; line-height:30px; color:#333; margin-top:6px; word-break:break-all; }
#wt th { font-size:22px; font-weight:normal; color:#333; background:#eee; padding:3px 0; }
#wt td { text-align:center; padding:4px 2px; }
.wd { font-size:24px; font-weight:bold; }
.wx { font-size:24px; }
.wt3 { font-size:22px; color:#222; }
/* 屏保模式：全屏覆盖，墨水屏大字号（用 table 排版，避开老内核的 flex 兼容问题） */
#saver { position:fixed; left:0; top:0; width:100%; height:100%; background:#fff; z-index:9999; display:none; overflow-y:auto; padding:22px 20px 50px; }
#saver.on { display:block; }
#saverExit { position:fixed; top:12px; right:14px; font-size:22px; color:#333; background:#fff; border:2px solid #999; border-radius:8px; padding:3px 12px; cursor:pointer; z-index:10000; }
.saverDate { font-size:46px; font-weight:300; letter-spacing:1px; margin:2px 0 4px; color:#111; }
.saverDate .wk { font-size:30px; color:#444; margin-left:12px; }
.saverCity { font-size:26px; color:#333; margin-bottom:10px; }
.saverSec { font-size:28px; font-weight:700; border-bottom:2px solid #000; padding-bottom:4px; margin:18px 0 10px; }
.saverWt { width:100%; border-collapse:collapse; table-layout:fixed; }
.saverWt td { text-align:center; border:1.5px solid #000; padding:12px 2px; vertical-align:top; }
.saverWt .wd { font-size:30px; font-weight:bold; }
.saverWt .wx { font-size:28px; margin:6px 0; }
.saverWt .wt3 { font-size:26px; }
.saverHist { font-size:28px; line-height:46px; word-break:break-all; }
.barLink { font-size:22px; color:#111; text-decoration:none; border:2px solid #000; padding:4px 10px; line-height:1; margin-left:6px; }
.barLink.locked { color:#999; border-color:#bbb; }
/* 游戏入口：顶栏小按钮（原独立横条太占竖向空间，压缩了今日作业可视区；改到顶栏后省约 100px）
   .btnWide 与 .btn 同高 36px，宽度随文字自适应，锁定态置灰；组内间距放大到 11px 避免拥挤 */
.btnWide { display:inline-block; height:36px; line-height:32px; padding:0 12px; border:2px solid #000; font-size:19px; font-weight:700; text-align:center; color:#000; text-decoration:none; vertical-align:middle; margin-left:11px; white-space:nowrap; }
.btnWide.locked { color:#999; border-color:#bbb; }
/* 坦克大战：全屏覆盖层（黑白高对比，墨水屏友好） */
#game { position:fixed; left:0; top:0; width:100%; height:100%; background:#fff; z-index:10001; display:none; }
#game.on { display:block; }
#gameHead { font-size:26px; font-weight:700; padding:8px 14px; border-bottom:2px solid #000; }
#gameHead .timer { float:right; font-size:30px; font-weight:700; }
#gameWrap { text-align:center; padding:10px; }
#gameCanvas { background:#fff; border:2px solid #000; touch-action:none; }
#gameInfo { font-size:22px; padding:6px 14px; }
#gamePad { text-align:center; padding:6px 0 14px; }
#gamePad td { text-align:center; }
.padBtn { display:inline-block; width:64px; height:56px; line-height:52px; border:2px solid #000; font-size:30px; font-weight:700; color:#000; background:#fff; cursor:pointer; -webkit-user-select:none; user-select:none; }
.padBtn:active { background:#000; color:#fff; }
.padBtn.fire { width:96px; background:#111; color:#fff; }
.padBtn.fire:active { background:#fff; color:#000; }
#gameMsg { font-size:26px; font-weight:700; text-align:center; padding:16px 12px; line-height:40px; }
/* 舒尔特方格：全屏覆盖，5×5 大格子，黑白高对比，墨水屏友好 */
#schulte { position:fixed; left:0; top:0; width:100%; height:100%; background:#fff; z-index:10002; display:none; overflow-y:auto; }
#schulte.on { display:block; }
#schHead { font-size:26px; font-weight:700; padding:8px 14px; border-bottom:2px solid #000; }
#schHead .timer { float:right; font-size:30px; font-weight:700; }
#schInfo { font-size:20px; padding:6px 14px; color:#333; }
#schWrap { text-align:center; padding:6px 10px; }
#schGrid { width:100%; border-collapse:collapse; table-layout:fixed; }
#schGrid td { border:2px solid #000; text-align:center; vertical-align:middle; font-size:34px; font-weight:700; height:58px; cursor:pointer; -webkit-user-select:none; user-select:none; }
#schGrid td.hit { background:#000; color:#fff; }
#schGrid td.err { background:#eee; }
#schHint { font-size:22px; text-align:center; min-height:30px; color:#111; font-weight:700; }
#schHistory { font-size:19px; line-height:28px; padding:4px 14px; color:#333; }
#schHistory b { color:#000; }
</style>
</head>
<body>

<div id="bar">&nbsp;</div>

<div id="scroll">
  <div class="sec">今日作业 <span class="secLink" onclick="openRules()">作业要求 ›</span></div>
  <div id="hw"></div>
  <div class="sec secGap">今日打卡</div>
  <div id="ck"></div>
</div>

<div id="bottom">

      <td class="cat"><img src="cat.png" width="152" height="152" alt="cat"></td>

      </td>

    <tr><th id="wtCity" colspan="3">天气预报</th></tr>

      <td id="wt0"><span class="empty">…</span></td>
      <td id="wt1"><span class="empty">…</span></td>
      <td id="wt2"><span class="empty">…</span></td>
    </tr>
  </table>
</div>

<div id="rulesPop">
  <div id="rulesPopHead">各科作业要求 <span id="rulesPopClose" onclick="closeRules()">✕ 关闭</span></div>
  <div id="rulesPopBody"></div>
</div>

<div id="saver">
  <div id="saverExit" onclick="exitSaver()">✕ 退出</div>
  <div class="saverDate" id="saverDate">&nbsp;</div>
  <div class="saverCity" id="saverCity"></div>
  <div class="saverSec">天气</div>
  <table class="saverWt"><tr>
    <td id="swt0"><span class="empty">…</span></td>
    <td id="swt1"><span class="empty">…</span></td>
    <td id="swt2"><span class="empty">…</span></td>
  </tr></table>
  <div class="saverSec">📜 历史上的今天</div>
  <div class="saverHist" id="saverHist">&nbsp;</div>
</div>

<div id="game">
  <div id="gameHead">坦克大战 <span class="timer" id="gameTimer">10:00</span></div>
  <div id="gameInfo">击毁 <b id="gameScore">0</b> 辆 · 生命 <b id="gameLife">3</b> · 方向键/WASD 移动，空格开火<span id="gameTimeupTip"></span></div>
  <div id="gameWrap">
    <canvas id="gameCanvas" width="360" height="360"></canvas>
    <div id="gameMsg" style="display:none"></div>
  </div>
  <table id="gamePad">
    <tr><td colspan="3"><span class="padBtn" data-k="up">▲</span></td></tr>
    <tr><td><span class="padBtn" data-k="left">◀</span></td><td><span class="padBtn fire" data-k="fire">开火</span></td><td><span class="padBtn" data-k="right">▶</span></td></tr>
    <tr><td colspan="3"><span class="padBtn" data-k="down">▼</span></td></tr>
  </table>
  <div style="text-align:center;padding-bottom:16px"><span class="barLink" onclick="exitGame()">退出游戏</span></div>
</div>

<div id="schulte">
  <div id="schHead">舒尔特方格 <span class="timer" id="schTimer">0.0 秒</span></div>
  <div id="schInfo">按顺序点 1 → 25 · 第 <b id="schRound">1</b> 轮 · 最佳 <b id="schBest">--</b> 秒</div>
  <div id="schWrap"><table id="schGrid"></table></div>
  <div id="schHint">&nbsp;</div>
  <div id="schHistory"></div>
  <div style="text-align:center;padding:10px 0 20px">
    <span class="barLink" onclick="newSchulteRound()">↻ 新一局</span>
    <span class="barLink" onclick="exitSchulte()" style="margin-left:14px">退出</span>
  </div>
</div>

<script>
var DATA=null, cur=null, latest=null;
function pad(n){ return (n<10?'0':'')+n; }
function fmtDate(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function weekCN(d){ return '周'+'日一二三四五六'.charAt(d.getDay()); }
/* 英文日期：Monday, November 9, 2026（不依赖 Intl，兼容老浏览器） */
function fmtDateEN(d){
  if(isNaN(d)) return '';
  /* 顶栏宽 758px 内要同时放日期+6 个按钮，长英文日期会溢出压住按钮，统一用短格式 */
  var wd=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()];
  var mo=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()];
  return wd+', '+mo+' '+d.getDate();
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function done(d,i){ try{ return localStorage.getItem('ck_'+d+'_'+i)=='1'; }catch(e){ return false; } }
function tog(i,el){ try{ localStorage.setItem('ck_'+cur+'_'+i, done(cur,i)?'0':'1'); }catch(e){} if(el&&el.parentNode) el.parentNode.classList.toggle('done'); }
function done2(d,i){ try{ return localStorage.getItem('hw_'+d+'_'+i)=='1'; }catch(e){ return false; } }
function tog2(j,el){ try{ localStorage.setItem('hw_'+cur+'_'+j, done2(cur,j)?'0':'1'); }catch(e){} if(el&&el.parentNode) el.parentNode.classList.toggle('done'); }

/* 各科作业要求：入口在今日打卡标题行右侧，点击整页弹窗展示（右上角关闭） */
var RULES=[
 {t:'数学', items:[

   '解决问题：作答在左，订正在右',
   '书写：黑色水笔，工整；错用横线划掉，禁用修正带；尽量不涂改，先打草稿',
   '学会检查：防抄错数、计算错误等低级失误',
   '学习习惯：听讲+复习；每天带数学书、《阳评》、堂练本、草稿本；备黑笔/2B铅笔/红笔/蓝笔+透明直尺'
 ]},
 {t:'语文预习', items:[
   '指读课文三遍',
   '标自然段',
   '圈二会字并口头组词',
   '圈四会字，书空并注音'
 ]},
 {t:'英语', items:[
   '句子：用标点、首字母大写、单词间留空格',
   '单词抄写（英语本）：一个单词一行写4个英文，下方写2个中文翻译',
   '家听格式：第一行写日期和星期',
   '每行听4个单词，每个“1英+1中”',
   '每个单词对照书本批改并订正',
   '听完后整体对照书本批改并订正'
 ]}
];
function renderRules(){
  var h='';
  for(var k=0;k<RULES.length;k++){
    h+='<div class="ruleCard"><div class="ruleTitle">'+esc(RULES[k].t)+'</div><div class="ruleList">';
    for(var m=0;m<RULES[k].items.length;m++){
      h+='<div class="ruleItem">· '+esc(RULES[k].items[m])+'</div>';
    }
    h+='</div></div>';
  }
  return h;
}
/* 各科作业要求：整页弹窗展示，右上角关闭 */
function openRules(){
  var b=document.getElementById('rulesPopBody'), p=document.getElementById('rulesPop');
  if(!b.innerHTML) b.innerHTML=renderRules();
  p.classList.add('on');
  p.scrollTop=0;
}
function closeRules(){ document.getElementById('rulesPop').classList.remove('on'); }

}
function resetGame(){
  G.on=true; G.px=8; G.py=16; G.pdir=0;
  G.enemies=[]; G.bullets=[]; G.eb=[];
  G.score=0; G.life=3; G.tick=0; G.keys={};
  document.getElementById('gameMsg').style.display='none';
  document.getElementById('gameTimeupTip').innerHTML='';
  for(var i=0;i<3;i++) spawnEnemy();
  updateGameHUD(); drawGame();
}
function spawnEnemy(){
  var col=1+Math.floor(Math.random()*(GGRID-2));
  G.enemies.push({x:col, y:0, dir:2});
}
function updateGameHUD(){
  var m=Math.floor(G.left/60), s=G.left%60;
  document.getElementById('gameTimer').textContent=m+':'+(s<10?'0':'')+s;
  document.getElementById('gameScore').textContent=G.score;
  document.getElementById('gameLife').textContent=G.life;
}
function gameClock(){
  if(!G.on) return;
  /* 时间到只停表、不中断当前这局；打完（被击毁/主动退出）自然结束，额度归零后不再给「再玩一局」 */
  if(G.left>0){
    G.left--;
    if(G.left<=0){
      G.left=0;
      document.getElementById('gameTimeupTip').innerHTML=' · <b>时间到，本局打完就结束</b>';
    }
  }
  updateGameHUD();
}
function fireBullet(){
  if(!G.on) return;
  var dx=0,dy=0;
  if(G.pdir===0){dy=-1;}else if(G.pdir===1){dx=1;}else if(G.pdir===2){dy=1;}else{dx=-1;}
  G.bullets.push({x:G.px, y:G.py, dx:dx, dy:dy});
}
function movePlayer(dir){
  if(!G.on) return;
  G.pdir=dir;
  var nx=G.px, ny=G.py;
  if(dir===0) ny--; else if(dir===1) nx++; else if(dir===2) ny++; else nx--;
  if(nx>=0&&nx<GGRID&&ny>=0&&ny<GGRID){ G.px=nx; G.py=ny; }
  drawGame();
}
function gameStep(){
  if(!G.on) return;
  var now=(new Date()).getTime();
  /* 玩家按住方向键连续移动 */
  if(now-G.lastMove>130){
    if(G.keys.up){ movePlayer(0); G.lastMove=now; }
    else if(G.keys.right){ movePlayer(1); G.lastMove=now; }
    else if(G.keys.down){ movePlayer(2); G.lastMove=now; }
    else if(G.keys.left){ movePlayer(3); G.lastMove=now; }
  }
  G.tick++;
  /* 敌人移动与开火 */
  for(var i=0;i<G.enemies.length;i++){
    var e=G.enemies[i];
    if(G.tick%3===0){
      var ny=e.y+1;
      if(ny>=GGRID){ e.y=0; e.x=1+Math.floor(Math.random()*(GGRID-2)); }
      else e.y=ny;
      if(Math.random()<0.18){
        G.eb.push({x:e.x, y:e.y, dx:0, dy:1});
      }
    }
  }
  /* 玩家子弹推进 */
  for(var b=G.bullets.length-1;b>=0;b--){
    var p=G.bullets[b];
    p.x+=p.dx*0.6; p.y+=p.dy*0.6;
    var hit=false;
    for(var k=0;k<G.enemies.length;k++){
      var en=G.enemies[k];
      if(Math.abs(p.x-en.x)<0.8&&Math.abs(p.y-en.y)<0.8){
        G.enemies.splice(k,1); G.score++; hit=true; break;
      }
    }
    if(hit||p.x<0||p.x>=GGRID||p.y<0||p.y>=GGRID) G.bullets.splice(b,1);
  }
  /* 敌人子弹推进 */
  for(var q=G.eb.length-1;q>=0;q--){
    var eb=G.eb[q];
    eb.y+=eb.dy*0.5;
    if(Math.abs(eb.x-G.px)<0.8&&Math.abs(eb.y-G.py)<0.8){
      G.eb.splice(q,1);
      G.life--;
      if(G.life<=0){ updateGameHUD(); gameOver('坦克被击毁！'); return; }
      G.px=8; G.py=16;
      updateGameHUD();
      continue;
    }
    if(eb.y>=GGRID||eb.y<0||eb.x<0||eb.x>=GGRID) G.eb.splice(q,1);
  }
  /* 补充敌人 */
  while(G.enemies.length<3) spawnEnemy();
  updateGameHUD();
  drawGame();
}
function drawTank(px,py,dir,solid){
  var c=G.ctx;
  c.fillStyle=solid?'#000':'#fff';
  c.strokeStyle='#000'; c.lineWidth=2;
  c.fillRect(px-8,py-8,16,16); c.strokeRect(px-8,py-8,16,16);
  /* 炮管：一个实心小矩形指向朝向 */
  c.fillStyle='#000';
  if(dir===0) c.fillRect(px-2,py-13,4,7);
  else if(dir===2) c.fillRect(px-2,py+6,4,7);
  else if(dir===1) c.fillRect(px+6,py-2,7,4);
  else c.fillRect(px-13,py-2,7,4);
}
function drawGame(){
  var c=G.ctx; if(!c) return;
  /* 全屏白色重绘，减少墨水屏残影 */
  c.fillStyle='#fff'; c.fillRect(0,0,GTILE*GGRID,GTILE*GGRID);
  /* 网格淡线（深灰，墨水屏清晰） */
  c.strokeStyle='#e0e0e0'; c.lineWidth=1;
  for(var g=1;g<GGRID;g++){
    c.beginPath(); c.moveTo(g*GTILE,0); c.lineTo(g*GTILE,GTILE*GGRID); c.stroke();
    c.beginPath(); c.moveTo(0,g*GTILE); c.lineTo(GTILE*GGRID,g*GTILE); c.stroke();
  }
  /* 敌人（空心方块） */
  for(var i=0;i<G.enemies.length;i++){
    var e=G.enemies[i]; drawTank(e.x*GTILE+10,e.y*GTILE+10,e.dir,false);
  }
  /* 玩家（实心方块） */
  drawTank(G.px*GTILE+10,G.py*GTILE+10,G.pdir,true);
  /* 子弹 */
  c.fillStyle='#000';
  for(var b=0;b<G.bullets.length;b++){ var p=G.bullets[b]; c.fillRect(p.x*GTILE-2,p.y*GTILE-2,5,5); }
  c.strokeStyle='#000'; c.lineWidth=1;
  for(var q=0;q<G.eb.length;q++){ var eb=G.eb[q]; c.strokeRect(eb.x*GTILE-2,eb.y*GTILE-2,5,5); }
}
function gameOver(msg){
  G.on=false;
  var m=document.getElementById('gameMsg');
  /* 当天额度还有剩 → 可继续玩；时间到 → 当天不能再开 */
  var again = (G.left>0)
    ? '<br><span class="barLink" onclick="openGame(true)">再玩一局（剩 '+G.left+' 秒）</span>'
    : '<br>今天的 10 分钟已用完，明天再来吧～';
  m.innerHTML=msg+'<br>本局击毁 '+G.score+' 辆'+again;
  m.style.display='block';
}

/* 键盘 + 触屏控制 */
document.addEventListener('keydown',function(e){
  if(!G.on) return;
  var k=e.keyCode;
  if(k===38||k===87){ G.keys.up=true; movePlayer(0); e.preventDefault(); }
  else if(k===39||k===68){ G.keys.right=true; movePlayer(1); e.preventDefault(); }
  else if(k===40||k===83){ G.keys.down=true; movePlayer(2); e.preventDefault(); }
  else if(k===37||k===65){ G.keys.left=true; movePlayer(3); e.preventDefault(); }
  else if(k===32||k===13){ fireBullet(); e.preventDefault(); }
  else if(k===27){ exitGame(); }
});
document.addEventListener('keyup',function(e){
  var k=e.keyCode;
  if(k===38||k===87) G.keys.up=false;
  else if(k===39||k===68) G.keys.right=false;
  else if(k===40||k===83) G.keys.down=false;
  else if(k===37||k===65) G.keys.left=false;
});
(function bindPad(){
  var btns=document.querySelectorAll('.padBtn');
  for(var i=0;i<btns.length;i++){
    (function(b){
      var key=b.getAttribute('data-k');
      var rep=null;
      function act(){
        if(key==='fire') fireBullet();
        else if(key==='up') movePlayer(0);
        else if(key==='right') movePlayer(1);
        else if(key==='down') movePlayer(2);
        else if(key==='left') movePlayer(3);
      }
      function start(e){ if(e.preventDefault) e.preventDefault(); act(); if(key!=='fire') rep=setInterval(act,160); }
      function stop(){ if(rep){ clearInterval(rep); rep=null; } }
      b.addEventListener('touchstart',start,false);
      b.addEventListener('touchend',stop,false);
      b.addEventListener('touchcancel',stop,false);
      b.addEventListener('mousedown',start,false);
      b.addEventListener('mouseup',stop,false);
      b.addEventListener('mouseleave',stop,false);
    })(btns[i]);
  }
})();

/* ========== 舒尔特方格：不限时，按顺序点 1-25，记录每轮完成时间 ========== */
var SH={on:false, timer:null, start:0, elapsed:0, next:1, nums:[], rounds:[]};
function shKey(d){ return 'schulte_'+d; }
function shLoadRounds(){
  try{ var a=JSON.parse(localStorage.getItem(shKey(cur))||'[]'); return (a&&a.push)?a:[]; }catch(e){ return []; }
}
function shSaveRounds(a){ try{ localStorage.setItem(shKey(cur), JSON.stringify(a)); }catch(e){} }
function shBest(){ var a=SH.rounds, b=0, i; for(i=0;i<a.length;i++){ if(!b||a[i]<b) b=a[i]; } return b; }
function shFmt(sec){ return (Math.round(sec*10)/10).toString(); }
function openSchulte(){
  SH.rounds=shLoadRounds();
  document.getElementById('schulte').classList.add('on');
  newSchulteRound();
}
function exitSchulte(){
  SH.on=false;
  if(SH.timer){ clearInterval(SH.timer); SH.timer=null; }
  document.getElementById('schulte').classList.remove('on');
}
function shuffle25(){
  var a=[],i,j,t;
  for(i=1;i<=25;i++) a.push(i);
  for(i=a.length-1;i>0;i--){ j=Math.floor(Math.random()*(i+1)); t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}
function newSchulteRound(){
  if(SH.timer){ clearInterval(SH.timer); SH.timer=null; }
  SH.nums=shuffle25(); SH.next=1; SH.start=0; SH.elapsed=0; SH.on=true;
  document.getElementById('schHint').innerHTML='点击数字 <b>1</b> 开始计时～';
  document.getElementById('schRound').textContent=(SH.rounds.length+1);
  document.getElementById('schBest').textContent=SH.rounds.length?shFmt(shBest()):'--';
  document.getElementById('schTimer').textContent='0.0 秒';
  shDrawGrid(); shDrawHistory();
}
function shDrawGrid(){
  var html='',i,n,r,c;
  for(r=0;r<5;r++){
    html+='<tr>';
    for(c=0;c<5;c++){
      n=SH.nums[r*5+c];
      html+='<td data-n="'+n+'" onclick="schTap('+n+',this)">'+n+'</td>';
    }
    html+='</tr>';
  }
  document.getElementById('schGrid').innerHTML=html;
}
function shTick(){
  if(!SH.on||!SH.start) return;
  SH.elapsed=(new Date()).getTime()-SH.start;
  document.getElementById('schTimer').textContent=shFmt(SH.elapsed/1000)+' 秒';
}
function schTap(n,el){
  if(!SH.on) return;
  if(n!==SH.next){
    el.className='err';
    (function(node){ setTimeout(function(){ node.className=''; },200); })(el);
    document.getElementById('schHint').innerHTML='顺序错啦，请点 <b>'+SH.next+'</b>';
    return;
  }
  if(!SH.start){
    SH.start=(new Date()).getTime();
    SH.timer=setInterval(shTick,100);
  }
  el.className='hit'; el.onclick=null;
  SH.next++;
  document.getElementById('schHint').innerHTML=(SH.next<=25)?('很好，接着点 <b>'+SH.next+'</b>'):'完成！';
  if(SH.next>25) shFinish();
}
function shFinish(){
  SH.on=false;
  if(SH.timer){ clearInterval(SH.timer); SH.timer=null; }
  var sec=SH.elapsed/1000;
  SH.rounds.push(sec); shSaveRounds(SH.rounds);
  document.getElementById('schTimer').textContent=shFmt(sec)+' 秒';
  document.getElementById('schBest').textContent=shFmt(shBest());
  document.getElementById('schHint').innerHTML='🎉 第 '+SH.rounds.length+' 轮完成！用时 <b>'+shFmt(sec)+' 秒</b>';
  shDrawHistory();
}
function shDrawHistory(){
  var a=SH.rounds, h='', i;
  if(!a.length){ document.getElementById('schHistory').innerHTML='还没有记录，点「新一局」开始吧～'; return; }
  h='最近成绩：';
  for(i=Math.max(0,a.length-10);i<a.length;i++){ h+='第'+(i+1)+'轮 <b>'+shFmt(a[i])+'s</b>'+(i<a.length-1?' · ':''); }
  document.getElementById('schHistory').innerHTML=h;
}

load();
setInterval(load,60000);
window.addEventListener('resize', fitScroll);
window.addEventListener('orientationchange', fitScroll);
