<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>雪碧成长日记</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html,body { background:#fff; color:#000; }
body { font-family:sans-serif; -webkit-text-size-adjust:none; }
#hd { background:#000; color:#fff; font-size:36px; font-weight:bold; padding:10px 14px; }
#bar { font-size:28px; padding:8px 10px; border-bottom:3px solid #000; }
#bar b { font-size:32px; }
.btn { display:inline-block; border:2px solid #000; padding:2px 12px; margin-left:6px; font-size:26px; color:#000; text-decoration:none; }
table { width:100%; border-collapse:collapse; table-layout:fixed; }
#wt th { font-size:24px; font-weight:normal; color:#333; border-bottom:2px solid #000; padding:4px 0; background:#eee; }
#wt td { text-align:center; vertical-align:top; padding:6px 2px; border-bottom:3px solid #000; }
.wd  { font-size:28px; font-weight:bold; }
.wx  { font-size:28px; }
.wt3 { font-size:26px; color:#222; }
td.col { vertical-align:top; padding:8px 12px 4px; }
td.col + td.col { border-left:3px solid #000; }
.sec { font-size:28px; font-weight:bold; border-bottom:2px solid #000; padding-bottom:4px; margin-bottom:6px; }
.item { font-size:32px; line-height:52px; }
.item input { width:28px; height:28px; margin-right:8px; vertical-align:middle; }
#diaryBox { padding:8px 14px 14px; }
#diaryBox p { font-size:30px; line-height:46px; margin-top:4px; }
.empty { font-size:28px; color:#555; line-height:44px; }
</style>
</head>
<body>

<div id="hd">雪碧成长日记</div>
<div id="bar">&nbsp;</div>

<table id="wt">
  <tr><th id="wtCity" colspan="3">天气</th></tr>
  <tr>
    <td id="wt0"><span class="empty">…</span></td>
    <td id="wt1"><span class="empty">…</span></td>
    <td id="wt2"><span class="empty">…</span></td>
  </tr>
</table>

<table>
  <tr>
    <td class="col" style="width:52%">
      <div class="sec">今日打卡</div>
      <div id="ck"></div>
    </td>
    <td class="col">
      <div class="sec">今日作业</div>
      <div id="hw"></div>
    </td>
  </tr>
</table>

<div id="diaryBox">
  <div class="sec">成长日记</div>
  <p id="diary">&nbsp;</p>
</div>

<script>
var DATA = null;
var cur = null;      // 当前显示日期 YYYY-MM-DD
var latest = null;   // 数据里最新一天

function pad(n){ return (n<10?'0':'')+n; }
function fmtDate(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function weekCN(d){ return '周'+'日一二三四五六'.charAt(d.getDay()); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ---- 打卡勾选（按日期隔离存 localStorage）---- */
function done(d,i){ try{ return localStorage.getItem('ck_'+d+'_'+i)=='1'; }catch(e){ return false; } }
function tog(i){ try{ localStorage.setItem('ck_'+cur+'_'+i, done(cur,i)?'0':'1'); }catch(e){} }
function done2(d,i){ try{ return localStorage.getItem('hw_'+d+'_'+i)=='1'; }catch(e){ return false; } }
function tog2(i){ try{ localStorage.setItem('hw_'+cur+'_'+i, done2(cur,i)?'0':'1'); }catch(e){} }

/* ---- 拉数据 ---- */
function load(){
  var x = new XMLHttpRequest();
  x.open('GET','data.json?t='+(new Date()).getTime(),true);
  x.onreadystatechange = function(){
    if(x.readyState==4 && x.status==200){
      try{ DATA = JSON.parse(x.responseText); }catch(e){ DATA=null; }
      if(!DATA) return;
      var ks=[], days=DATA.days||{}, k;
      for(k in days){ if(days.hasOwnProperty(k)) ks.push(k); }
      ks.sort();
      latest = ks.length ? ks[ks.length-1] : fmtDate(new Date());
      if(!cur) cur = latest;
      render();
      weather();
    }
  };
  x.send(null);
}

/* ---- 渲染某一天 ---- */
function render(){
  var days=(DATA&&DATA.days)||{}, dd=days[cur]||{};
  var dt=new Date(cur.replace(/-/g,'/'));
  var h='<b>'+cur+' '+(isNaN(dt)?'':weekCN(dt))+'</b>'
      +'<a class="btn" href="javascript:void(0)" onclick="page(-1)">‹前</a>'
      +'<a class="btn" href="javascript:void(0)" onclick="page(1)">后›</a>'
      +'<a class="btn" href="javascript:void(0)" onclick="goLatest()">今天</a>'
      +'<a class="btn" href="javascript:void(0)" onclick="load()">刷新</a>';
  document.getElementById('bar').innerHTML=h;

  document.getElementById('hd').innerHTML=esc((DATA&&DATA.title)||'成长日记');

  var ck=dd.checklist||[], s='', i;
  if(!ck.length) s='<div class="empty">这一天还没有录入～</div>';
  for(i=0;i<ck.length;i++){
    s+='<div class="item"><input type="checkbox"'+(done(cur,i)?' checked':'')+' onclick="tog('+i+')"> '+esc(ck[i])+'</div>';
  }
  document.getElementById('ck').innerHTML=s;

  var hw=dd.homework||[], t='', j;
  if(!hw.length) t='<div class="empty">没有作业，痛快玩！</div>';
  for(j=0;j<hw.length;j++){
    t+='<div class="item"><input type="checkbox"'+(done2(cur,j)?' checked':'')+' onclick="tog2('+j+')"> '+esc(hw[j])+'</div>';
  }
  document.getElementById('hw').innerHTML=t;

  document.getElementById('diary').innerHTML = dd.diary ? esc(dd.diary) : '<span class="empty">这一天还没有日记～</span>';
}

function page(n){
  var dt=new Date(cur.replace(/-/g,'/'));
  dt.setDate(dt.getDate()+n);
  cur=fmtDate(dt);
  render();
}
function goLatest(){ cur=latest; render(); }

/* ---- 天气（Open-Meteo，最近三天，一行三列）---- */
var WMO={0:'晴',1:'晴',2:'多云',3:'阴',45:'雾',48:'雾',51:'毛毛雨',53:'毛毛雨',55:'毛毛雨',56:'冻毛毛雨',57:'冻毛毛雨',61:'小雨',63:'中雨',65:'大雨',66:'冻雨',67:'冻雨',71:'小雪',73:'中雪',75:'大雪',77:'米雪',80:'阵雨',81:'阵雨',82:'强阵雨',85:'阵雪',86:'阵雪',95:'雷阵雨',96:'雷阵雨',99:'雷冰雹'};
function weather(){
  if(!DATA||!DATA.weather) return;
  var w=DATA.weather;
  document.getElementById('wtCity').innerHTML=esc(w.city||'')+' · 最近三天';
  var url='https://api.open-meteo.com/v1/forecast?latitude='+w.lat+'&longitude='+w.lon
         +'&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=3';
  var x=new XMLHttpRequest();
  x.open('GET',url,true);
  x.onreadystatechange=function(){
    if(x.readyState==4&&x.status==200){
      var j; try{ j=JSON.parse(x.responseText).daily; }catch(e){ return; }
      var names=['今天','明天','后天'];
      for(var i=0;i<3;i++){
        var wx=WMO[j.weather_code[i]]||'—';
        var hi=Math.round(j.temperature_2m_max[i]), lo=Math.round(j.temperature_2m_min[i]);
        document.getElementById('wt'+i).innerHTML=
          '<div class="wd">'+names[i]+'</div><div class="wx">'+wx+'</div><div class="wt3">'+hi+'° / '+lo+'°</div>';
      }
    }
  };
  x.send(null);
}

load();
setInterval(load, 60000);
</script>
</body>
</html>
